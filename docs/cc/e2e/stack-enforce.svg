<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">Inside the guest</text><text x="64" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every request is answered against the measured document — there is no path around it</text><text x="94" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#f85149" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">FROM THE HOST</text><text x="94" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">it chooses what to ask for</text><rect x="540" y="300" width="1310" height="420" rx="16" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/><text x="564" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">INSIDE THE CVM</text><text x="564" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">where the answer is decided</text><line x1="515" y1="234" x2="515" y2="900" stroke="#3fb950" stroke-width="4" opacity="0.6"/><text x="491" y="820" transform="rotate(-90 491 820)" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="middle" letter-spacing="4" opacity="0.8">HARDWARE BOUNDARY</text><rect x="100" y="360" width="380" height="300" rx="10" fill="none" stroke="#e6edf3" stroke-width="2" opacity="0.9"/><text x="126" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the request</text><text x="126" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the host asks for something:</text><text x="126" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">start a container, run a process,</text><text x="126" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">mount a volume, open a shell</text><text x="126" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="126" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">ttRPC over vsock</text><rect x="570" y="360" width="380" height="300" rx="10" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="596" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the agent</text><text x="596" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">pid 1 in the guest — every</text><text x="596" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">request arrives here, and there</text><text x="596" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">is no other way in</text><text x="596" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="596" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">it never asks the host anything</text><rect x="1015" y="360" width="380" height="300" rx="10" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="1041" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the document</text><text x="1041" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the policy the hardware</text><text x="1041" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">measured, evaluated per request</text><text x="1041" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1041" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every request starts denied</text><text x="1041" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">layer hashes: declared vs served</text><rect x="1460" y="360" width="380" height="300" rx="10" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1486" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="29" text-anchor="start" font-weight="600"><tspan fill="#3fb950">allow</tspan><tspan fill="#8b949e"> / </tspan><tspan fill="#f85149">deny</tspan></text><text x="1486" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">only what the document names</text><text x="1486" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">is allowed to happen</text><text x="1486" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1486" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">a refusal is the whole answer —</text><text x="1486" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">nothing half-applied is left</text><line x1="492" y1="510.0" x2="558" y2="510.0" stroke="#e6edf3" stroke-width="3" opacity="1.0" marker-end="url(#a-ink)"/><line x1="962" y1="510.0" x2="1003" y2="510.0" stroke="#3fb950" stroke-width="3" opacity="1.0" marker-end="url(#a-ok)"/><line x1="1407" y1="510.0" x2="1448" y2="510.0" stroke="#3fb950" stroke-width="3" opacity="1.0" marker-end="url(#a-ok)"/><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">The host decides what to ask for. It does not get to decide what the answer is.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">And the document it is answered against is the one the hardware measured — the host cannot substitute another.</text></svg>