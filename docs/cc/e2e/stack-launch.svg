<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">Into the hardware</text><text x="64" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the digest is stamped in at launch — and the guest re-derives it from what it was actually served</text><rect x="70" y="300" width="860" height="420" rx="16" fill="none" stroke="#f85149" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/><text x="94" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#f85149" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">OUTSIDE THE GUEST</text><text x="94" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the host carries the document</text><rect x="990" y="300" width="860" height="420" rx="16" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/><text x="1014" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">INSIDE THE CVM</text><text x="1014" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">and cannot reach past this line</text><line x1="960" y1="234" x2="960" y2="750" stroke="#3fb950" stroke-width="4" opacity="0.6"/><text x="966" y="860" transform="rotate(-90 966 860)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#3fb950" text-anchor="middle" letter-spacing="2" opacity="0.8">HARDWARE BOUNDARY</text><rect x="100" y="360" width="380" height="300" rx="10" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="126" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the document</text><text x="126" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">policy.rego and the rest,</text><text x="126" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">gzip + base64 as one TOML,</text><text x="126" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">carried on the pod spec</text><text x="126" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="126" y="594" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">…hypervisor.cc_init_data</text><rect x="545" y="360" width="380" height="300" rx="10" fill="none" stroke="#d29922" stroke-width="2" opacity="0.9"/><text x="571" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">its digest</text><text x="571" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">sha256 over that document,</text><text x="571" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">computed before the VM starts</text><text x="571" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="571" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">one 32-byte value — the only</text><text x="571" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">thing the hardware is told</text><rect x="1010" y="360" width="380" height="300" rx="10" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1036" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">measured at launch</text><text x="1036" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the digest goes in as HOST_DATA</text><text x="1036" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">and is sealed into the report</text><text x="1036" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the platform signs</text><text x="1036" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1036" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">nothing can change it after boot</text><rect x="1455" y="360" width="380" height="300" rx="10" fill="#0d2a17" stroke="#3fb950" stroke-width="2" opacity="1"/><text x="1481" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">checked in the guest</text><text x="1481" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the agent hashes the initdata it</text><text x="1481" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">was actually served, reads</text><text x="1481" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">HOST_DATA back, and compares</text><text x="1481" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1481" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">if they differ, it stops</text><line x1="492" y1="510.0" x2="533" y2="510.0" stroke="#58a6ff" stroke-width="3" opacity="1.0" marker-end="url(#a-doc)"/><line x1="937" y1="510.0" x2="998" y2="510.0" stroke="#d29922" stroke-width="3" opacity="1.0" marker-end="url(#a-warm)"/><line x1="1402" y1="510.0" x2="1443" y2="510.0" stroke="#3fb950" stroke-width="3" opacity="1.0" marker-end="url(#a-ok)"/><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">The host computes the digest and carries the document — but it cannot choose what the hardware records, and cannot change it after.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">The guest hashes what it was actually served. If the two ever differ it stops — and because the agent is pid 1, that takes the VM with it.</text></svg>