<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">Before deployment</text><text x="64" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the rules are derived from the pod spec — nothing is written by hand</text><rect x="70" y="300" width="1780" height="420" rx="16" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/><text x="94" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#58a6ff" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">THE CUSTOMER'S MACHINE</text><text x="94" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">before the host has seen anything</text><rect x="110" y="360" width="380" height="300" rx="10" fill="none" stroke="#30363d" stroke-width="2" opacity="0.9"/><text x="136" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the pod spec</text><text x="136" y="468" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the workload as written</text><text x="136" y="502" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">image · command · mounts</text><text x="136" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="136" y="570" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">runtimeClassName: kata-cc</text><rect x="550" y="360" width="380" height="300" rx="10" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.9"/><text x="576" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">genpolicy</text><text x="576" y="468" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">reads that exact spec</text><text x="576" y="502" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">and derives the rules</text><text x="576" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="576" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">no hand-written policy</text><rect x="990" y="360" width="380" height="300" rx="10" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="1016" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the measured document</text><text x="1016" y="468" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">policy.rego</text><text x="1016" y="502" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">fragment-issuers.toml</text><text x="1016" y="536" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">aa.toml · cdh.toml</text><text x="1016" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1016" y="604" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">one annotation on the pod</text><rect x="1430" y="360" width="380" height="300" rx="10" fill="none" stroke="#d29922" stroke-width="2" opacity="0.9"/><text x="1456" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">its sha256</text><text x="1456" y="468" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the digest of that document,</text><text x="1456" y="502" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">stamped into the hardware</text><text x="1456" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">when the guest launches</text><text x="1456" y="570" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1456" y="604" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">nothing else is trusted</text><text x="1456" y="604" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#e6edf3" text-anchor="start" font-weight="normal" opacity="1.0"></text><line x1="502" y1="510.0" x2="538" y2="510.0" stroke="#58a6ff" stroke-width="3" opacity="1.0" marker-end="url(#a-doc)"/><line x1="942" y1="510.0" x2="978" y2="510.0" stroke="#58a6ff" stroke-width="3" opacity="1.0" marker-end="url(#a-doc)"/><line x1="1382" y1="510.0" x2="1418" y2="510.0" stroke="#d29922" stroke-width="3" opacity="1.0" marker-end="url(#a-warm)"/><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">Every rule the guest will enforce is decided here — and every request starts denied, so the generated rules turn on only what this pod needs.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">The host never contributes to this document. It only carries it.</text></svg>