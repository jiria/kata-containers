<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">A pod's policy</text><text x="64" y="94" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">generated before deployment · measured into the hardware at launch · enforced inside the guest · provable from outside</text><rect x="64" y="170" width="372" height="700" rx="14" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="82" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">BEFORE DEPLOYMENT</text><text x="82" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the customer's machine</text><rect x="470" y="170" width="452" height="700" rx="14" fill="none" stroke="#f85149" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="488" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f85149" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">THE HOST</text><text x="488" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">controls delivery — trusted with nothing</text><rect x="1148" y="170" width="708" height="700" rx="14" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="1166" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">INSIDE THE CVM</text><text x="1166" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">measured at launch — decides everything</text><line x1="1044" y1="108" x2="1044" y2="944" stroke="#3fb950" stroke-width="3" opacity="0.6"/><text x="1066" y="760" transform="rotate(-90 1066 760)" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#3fb950" text-anchor="middle" letter-spacing="3" opacity="0.75">HARDWARE BOUNDARY</text><rect x="92" y="204" width="316" height="132" rx="8" fill="none" stroke="#30363d" stroke-width="2" opacity="0.9"/><text x="110" y="238" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">pod spec</text><text x="110" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the workload as written:</text><text x="110" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">image, command, mounts</text><text x="110" y="318" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">runtimeClassName: kata-cc</text><line x1="152" y1="336" x2="152" y2="372" stroke="#58a6ff" stroke-width="2" opacity="1.0" marker-end="url(#a-doc)"/><rect x="92" y="372" width="316" height="132" rx="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.9"/><text x="110" y="406" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">genpolicy</text><text x="110" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">derives the rules from this exact</text><text x="110" y="460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">spec — nothing is hand-written</text><text x="110" y="486" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">src/tools/genpolicy</text><line x1="152" y1="504" x2="152" y2="540" stroke="#58a6ff" stroke-width="2" opacity="1.0" marker-end="url(#a-doc)"/><rect x="92" y="540" width="316" height="158" rx="8" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="110" y="574" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the measured document</text><text x="110" y="602" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">algorithm = "sha256"</text><text x="110" y="628" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">policy.rego</text><text x="110" y="654" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">fragment-issuers.toml</text><text x="110" y="680" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">aa.toml · cdh.toml</text><text x="92" y="732" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every rule the guest will enforce,</text><text x="92" y="756" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">in one document</text><text x="92" y="790" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">gzip + base64, carried as one</text><text x="92" y="812" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">annotation on the pod spec:</text><text x="92" y="838" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#58a6ff" text-anchor="start" font-weight="normal" opacity="1.0">…hypervisor.cc_init_data</text><path d="M 436 307 C 452 307 454 307 470 307" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#a-doc)"/><rect x="496" y="204" width="400" height="206" rx="8" fill="none" stroke="#f85149" stroke-width="2" opacity="0.9"/><text x="514" y="238" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the delivery path</text><text x="514" y="272" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">kubelet</text><text x="514" y="312" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">containerd 2.3 + erofs snapshotter</text><text x="514" y="352" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">containerd-shim-kata-cc-v2</text><text x="514" y="392" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">cloud-hypervisor --features mshv,sev_snp</text><rect x="496" y="438" width="400" height="132" rx="8" fill="none" stroke="#f85149" stroke-width="2" opacity="0.9"/><text x="514" y="472" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the image layers</text><text x="514" y="500" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">layer.erofs + layer.erofs.dmverity</text><text x="514" y="526" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the host computes and presents</text><text x="514" y="552" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every root hash</text><text x="496" y="608" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">the host builds and serves</text><text x="496" y="632" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">all of it — and nothing on</text><text x="496" y="656" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">this side re-checks itself.</text><path d="M 922 294 C 1012 294 1030 330 1140 330" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#a-doc)"/><text x="928" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#58a6ff" text-anchor="start" font-weight="normal" opacity="1.0">the document</text><text x="928" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#58a6ff" text-anchor="start" font-weight="normal" opacity="1.0">byte for byte</text><path d="M 922 634 C 1012 634 1030 380 1140 380" fill="none" stroke="#d29922" stroke-width="3" marker-end="url(#a-warm)"/><text x="928" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">its sha256,</text><text x="928" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">stamped into</text><text x="928" y="434" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">the hardware</text><text x="928" y="456" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">HOST_DATA</text><rect x="1174" y="196" width="656" height="106" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">kata-agent — pid 1 in the guest</text><text x="1192" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the init process (getpid() == 1), so an abort takes the VM</text><text x="1192" y="284" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">src/agent/src/main.rs</text><rect x="1174" y="322" width="656" height="132" rx="8" fill="#0d2a17" stroke="#3fb950" stroke-width="2" opacity="1"/><text x="1192" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">does the served document match the measurement?</text><text x="1192" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">hashes the initdata it was served, reads HOST_DATA back</text><text x="1192" y="410" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">out of the SNP report via /dev/sev-guest, compares</text><text x="1192" y="436" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">src/agent/src/hostdata.rs</text><rect x="1174" y="474" width="656" height="132" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="508" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">then every request is answered against it</text><text x="1192" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">Regorus evaluates policy.rego for each request</text><text x="1192" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">declared vs presented dm-verity root hashes</text><text x="1192" y="588" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">SRM: two-phase commit, fragment store, SVN floor</text><rect x="1174" y="626" width="656" height="132" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="660" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">and it can be extended without redeploying</text><text x="1192" y="688" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">COSE_Sign1, did:x509 issuer, svn &gt;= the measured floor</text><text x="1192" y="714" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">host-delivered, trusted only on its signature</text><text x="1192" y="740" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">security-reference-monitor/src/fragments.rs</text><line x1="510" y1="942" x2="1044" y2="942" stroke="#e6edf3" stroke-width="3" opacity="0.85" stroke-dasharray="5 6"/><line x1="1044" y1="942" x2="1172" y2="942" stroke="#e6edf3" stroke-width="4" opacity="1.0" marker-end="url(#a-ink)"/><text x="514" y="898" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">CreateContainerRequest, ExecProcessRequest, …</text><text x="514" y="924" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">every container request — ttRPC over vsock</text><text x="1192" y="950" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="start" font-weight="700"><tspan fill="#3fb950">allow</tspan><tspan fill="#8b949e"> / </tspan><tspan fill="#f85149">deny</tspan></text><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">The host decides what to deliver. The guest decides what to accept — against a document the hardware already measured.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">And the customer decides whether to trust any of it: the same measurement, carried in a signed hardware report they can check from outside the machine.</text></svg>