<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">Extending the policy</text><text x="64" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">a signed rule, from an issuer the measured document already named, at or above the version floor it set</text><text x="94" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#f85149" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">FROM THE HOST</text><text x="94" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">it delivers, and that is all</text><rect x="540" y="300" width="1310" height="420" rx="16" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.4" stroke-dasharray="6 8"/><text x="564" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">INSIDE THE CVM</text><text x="564" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">where it is accepted, or is not</text><line x1="515" y1="234" x2="515" y2="750" stroke="#3fb950" stroke-width="4" opacity="0.6"/><text x="521" y="320" transform="rotate(-90 521 320)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#3fb950" text-anchor="middle" letter-spacing="2" opacity="0.8">HARDWARE BOUNDARY</text><rect x="100" y="360" width="380" height="300" rx="10" fill="none" stroke="#e6edf3" stroke-width="2" opacity="0.9"/><text x="126" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the fragment</text><text x="126" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">a signed Rego rule, handed in</text><text x="126" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">while the pod is running</text><text x="126" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="126" y="562" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">COSE_Sign1</text><text x="126" y="594" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">application/cose-x509+rego</text><rect x="570" y="360" width="380" height="300" rx="10" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="596" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">whose rule is it</text><text x="596" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">a did:x509 identity, derived</text><text x="596" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">from the certificate chain</text><text x="596" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">carried in the signature</text><text x="596" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="596" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">must be one the document named</text><rect x="1015" y="360" width="380" height="300" rx="10" fill="none" stroke="#d29922" stroke-width="2" opacity="0.9"/><text x="1041" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">is it new enough</text><text x="1041" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every fragment carries an SVN,</text><text x="1041" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">and the measured policy set</text><text x="1041" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the floor it must clear</text><text x="1041" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1041" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">below the floor → refused</text><rect x="1460" y="360" width="380" height="300" rx="10" fill="#0d2a17" stroke="#3fb950" stroke-width="2" opacity="1"/><text x="1486" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">then it applies</text><text x="1486" y="466" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">added in two phases, so a</text><text x="1486" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">refusal leaves nothing behind</text><text x="1486" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0"></text><text x="1486" y="562" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the pod was never restarted,</text><text x="1486" y="594" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">and the measurement is unchanged</text><line x1="492" y1="510.0" x2="558" y2="510.0" stroke="#e6edf3" stroke-width="3" opacity="1.0" marker-end="url(#a-ink)"/><line x1="962" y1="510.0" x2="1003" y2="510.0" stroke="#58a6ff" stroke-width="3" opacity="1.0" marker-end="url(#a-doc)"/><line x1="1407" y1="510.0" x2="1448" y2="510.0" stroke="#d29922" stroke-width="3" opacity="1.0" marker-end="url(#a-warm)"/><path d="M 290 668 C 290 780, 340 800, 430 800 L 620 800 C 680 800, 700 780, 700 730" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-bad)"/><text x="870" y="844" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#f85149" text-anchor="middle" font-weight="normal" opacity="1.0">the host can hand one in while the pod runs, and hand in a newer one later</text><text x="870" y="876" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="middle" font-weight="normal" opacity="1.0">the policy is extended without redeploying the pod</text><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">The host can deliver a fragment. It cannot make the guest accept one.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">Nothing about a fragment is trusted except its signature — and the measured document decides whose signature counts.</text></svg>