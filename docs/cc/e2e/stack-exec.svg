<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="a-doc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker><marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker></defs><rect width="1920" height="1080" fill="#0d1117"/><text x="64" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">A pod's policy</text><text x="64" y="94" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">generated before deployment · measured into the hardware at launch · enforced inside the guest · provable from outside</text><rect x="64" y="300" width="372" height="520" rx="14" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="82" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#58a6ff" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">BEFORE DEPLOYMENT</text><text x="82" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the customer's machine</text><rect x="470" y="300" width="452" height="520" rx="14" fill="none" stroke="#f85149" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="488" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f85149" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">THE HOST</text><text x="488" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">controls delivery — trusted with nothing</text><rect x="1148" y="300" width="708" height="520" rx="14" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.45" stroke-dasharray="6 8"/><text x="1166" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0" letter-spacing="2">INSIDE THE CVM</text><text x="1166" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">measured at launch — decides everything</text><line x1="1044" y1="238" x2="1044" y2="894" stroke="#3fb950" stroke-width="3" opacity="0.6"/><text x="1066" y="710" transform="rotate(-90 1066 710)" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#3fb950" text-anchor="middle" letter-spacing="3" opacity="0.75">HARDWARE BOUNDARY</text><rect x="92" y="334" width="316" height="106" rx="8" fill="none" stroke="#30363d" stroke-width="2" opacity="0.9"/><text x="110" y="368" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">pod spec</text><text x="110" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the workload as written:</text><text x="110" y="422" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">image, command, mounts</text><line x1="152" y1="440" x2="152" y2="476" stroke="#58a6ff" stroke-width="2" opacity="1.0" marker-end="url(#a-doc)"/><rect x="92" y="476" width="316" height="106" rx="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.9"/><text x="110" y="510" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">genpolicy</text><text x="110" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">derives the rules from</text><text x="110" y="564" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">this exact spec</text><line x1="152" y1="582" x2="152" y2="618" stroke="#58a6ff" stroke-width="2" opacity="1.0" marker-end="url(#a-doc)"/><rect x="92" y="618" width="316" height="106" rx="8" fill="#0d2136" stroke="#58a6ff" stroke-width="2" opacity="1"/><text x="110" y="652" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the measured document</text><text x="110" y="680" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">policy.rego</text><text x="110" y="706" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">fragment-issuers.toml</text><text x="92" y="758" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every rule the guest will enforce,</text><text x="92" y="782" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">in one document</text><path d="M 436 437 C 452 437 454 437 470 437" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#a-doc)"/><rect x="496" y="334" width="400" height="206" rx="8" fill="none" stroke="#f85149" stroke-width="2" opacity="0.9"/><text x="514" y="368" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the delivery path</text><text x="514" y="402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">kubelet</text><text x="514" y="442" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">containerd + erofs snapshotter</text><text x="514" y="482" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">kata shim (runtime-rs)</text><text x="514" y="522" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">cloud-hypervisor on /dev/mshv</text><rect x="496" y="568" width="400" height="106" rx="8" fill="none" stroke="#f85149" stroke-width="2" opacity="0.9"/><text x="514" y="602" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">the image layers</text><text x="514" y="630" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">each layer an EROFS image —</text><text x="514" y="656" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the host presents its root hash</text><text x="496" y="712" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">the host builds and serves</text><text x="496" y="736" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">all of it — and nothing on</text><text x="496" y="760" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#f85149" text-anchor="start" font-weight="normal" opacity="1.0">this side re-checks itself.</text><path d="M 922 424 C 1012 424 1030 460 1140 460" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#a-doc)"/><text x="928" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#58a6ff" text-anchor="start" font-weight="normal" opacity="1.0">the document</text><text x="928" y="418" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#58a6ff" text-anchor="start" font-weight="normal" opacity="1.0">byte for byte</text><path d="M 922 764 C 1012 764 1030 510 1140 510" fill="none" stroke="#d29922" stroke-width="3" marker-end="url(#a-warm)"/><text x="928" y="520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">its sha256,</text><text x="928" y="542" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">stamped into</text><text x="928" y="564" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">the hardware</text><rect x="1174" y="326" width="656" height="80" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">kata-agent — pid 1 in the guest</text><text x="1192" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">the init process, so a refusal takes the VM with it</text><rect x="1174" y="426" width="656" height="106" rx="8" fill="#0d2a17" stroke="#3fb950" stroke-width="2" opacity="1"/><text x="1192" y="460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">does the served document match the measurement?</text><text x="1192" y="488" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">it hashes what it was actually served, reads what the</text><text x="1192" y="514" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">hardware was told, and stops if the two differ</text><rect x="1174" y="552" width="656" height="106" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="586" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">then every request is answered against it</text><text x="1192" y="614" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">what may run, what may be mounted, who gets a shell</text><text x="1192" y="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">every layer's root hash checked against the declared one</text><rect x="1174" y="678" width="656" height="106" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.9"/><text x="1192" y="712" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">and it can be extended without redeploying</text><text x="1192" y="740" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">a signed rule, from an issuer the measured policy already</text><text x="1192" y="766" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">named, at or above the version floor it set</text><line x1="510" y1="872" x2="1044" y2="872" stroke="#e6edf3" stroke-width="3" opacity="0.85" stroke-dasharray="5 6"/><line x1="1044" y1="872" x2="1172" y2="872" stroke="#3fb950" stroke-width="4" opacity="1.0" marker-end="url(#a-ok)"/><text x="514" y="854" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="600" opacity="1.0">every container request — ttRPC over vsock</text><text x="1192" y="880" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#3fb950" text-anchor="start" font-weight="700" opacity="1.0">allow / deny</text><text x="64" y="1004" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="start" font-weight="normal" opacity="1.0">The host decides what to deliver. The guest decides what to accept — against a document the hardware already measured.</text><text x="64" y="1040" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#d29922" text-anchor="start" font-weight="normal" opacity="1.0">And the customer decides whether to trust any of it: the same measurement, carried in a signed hardware report they can check from outside the machine.</text></svg>